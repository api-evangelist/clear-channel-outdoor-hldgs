apiVersion: naftiko.io/v1
kind: SharedCapability
metadata:
  name: clear-channel-outdoor-direct
  title: Clear Channel Outdoor Automated Direct
  provider: Clear Channel Outdoor Holdings
  spec: ../../openapi/clear-channel-outdoor-direct-openapi.yml
  description: >-
    Reusable capability bundle exposing the CCO.IO Automated Direct API surface
    for searching displays/networks/markets, building products and orders, and
    managing creatives, bookings, and pricing on Clear Channel Outdoor inventory.
  authentication:
    type: oauth2
    flow: clientCredentials
    tokenUrl: https://direct.cco.io/v2/token
    scopes:
      - displays-modify
      - orders-modify
      - bookings-modify
      - campaigns-modify
      - creatives-modify
      - customers-modify
      - markets-modify
      - networks-modify
      - photos-modify
      - products-modify
      - quotes-modify
      - renewals-modify
      - restrictions-modify
operations:
  - id: search-displays
    method: GET
    path: /v1/displays
    summary: Search Displays
  - id: get-display
    method: GET
    path: /v1/displays/{id}
    summary: Get Display
  - id: search-networks
    method: GET
    path: /v1/networks
    summary: Search Networks
  - id: search-network-displays
    method: GET
    path: /v1/networks/{id}/displays
    summary: Search Network Displays
  - id: search-products
    method: GET
    path: /v1/products
    summary: Search Products
  - id: create-order
    method: POST
    path: /v1/orders
    summary: Create Order
  - id: get-order
    method: GET
    path: /v1/orders/{id}
    summary: Get Order
  - id: search-orders
    method: GET
    path: /v1/orders
    summary: Search Orders
  - id: search-bookings
    method: GET
    path: /v1/bookings
    summary: Search Bookings
  - id: search-campaigns
    method: GET
    path: /v1/campaigns
    summary: Search Campaigns
  - id: search-creatives
    method: GET
    path: /v1/creatives
    summary: Search Creatives
  - id: search-creatives-v2
    method: GET
    path: /v2/creatives
    summary: Search Ad Creatives
  - id: get-current-quote
    method: GET
    path: /v1/quotes/current
    summary: Get Current Quote
  - id: search-taxa-iab-v3
    method: GET
    path: /v3/taxa
    summary: Search IAB v3 Taxonomies
