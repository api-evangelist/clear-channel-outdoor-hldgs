description: >-
  Clear Channel Outdoor Holdings is one of the largest out-of-home advertising
  companies in the world and a Fortune 1000 firm, operating billboards, street
  furniture, transit, and digital out-of-home displays across the United States
  and select international markets. The company supports programmatic
  digital-out-of-home (pDOOH) buying through major demand side platforms and
  offers RADAR, an audience and attribution data suite based on aggregated
  mobile location data. Clear Channel Outdoor does not publish a public
  developer portal; integrations occur through DSP partners.
